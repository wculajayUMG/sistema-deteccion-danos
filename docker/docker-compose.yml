version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-seguros_elroble_ia}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../apps/ai-service/weights:/app/weights
    environment:
      MODEL_PATH: weights/best.pt
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.10}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
      IMAGE_SIZE: ${IMAGE_SIZE:-640}
      DEBUG: "false"

  backend-api:
    build:
      context: ../apps/backend-api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-seguros_elroble_ia}
      DATABASE_SYNC: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CF_R2_ACCOUNT_ID: ${CF_R2_ACCOUNT_ID}
      CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID}
      CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY}
      CF_R2_BUCKET_NAME: ${CF_R2_BUCKET_NAME}
      CF_R2_PUBLIC_URL: ${CF_R2_PUBLIC_URL}

  frontend-web:
    build:
      context: ..
      dockerfile: apps/frontend-web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Seguros El Roble — Sistema IA}

volumes:
  postgres_data:
  redis_data:
